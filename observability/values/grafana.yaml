# Grafana (chart grafana/grafana)
# Todo se carga por provisioning desde el repo: datasources, tableros y alertas.
# Nada se configura a mano en la interfaz, así una reinstalación deja todo igual.

adminUser: admin
adminPassword: admin

persistence:
  enabled: false

grafana.ini:
  server:
    # Los links de las notificaciones de Discord apuntan acá (port-forward local)
    root_url: http://localhost:3000
  unified_alerting:
    enabled: true

# El webhook de Discord llega como variable de entorno desde un Secret
# (lo crea observability.sh a partir de .env, que no se versiona)
envFromSecret: grafana-discord

# ---------------------------------------------------------------- Datasources
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-server.observability.svc:80
        isDefault: true
        editable: false

      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki.observability.svc:3100
        editable: false

      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo.observability.svc:3200
        editable: false
        jsonData:
          # Traza -> Logs: desde un span se abren los logs del mismo servicio
          # en la ventana de tiempo del span (3.3.3)
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: '-10s'   # margen por desfase de relojes
            spanEndTimeShift: '10s'
            tags:
              - key: service.name        # atributo del span en Tempo
                value: app               # etiqueta {app="..."} en Loki
            filterByTraceID: false
            filterBySpanID: false

# ------------------------------------------------------------------ Tableros
# Los JSON viven en observability/grafana/dashboards y se cargan en el
# ConfigMap "grafana-dashboards" (lo crea observability.sh)
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: the-store
        orgId: 1
        folder: The Store
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards/the-store

dashboardsConfigMaps:
  the-store: grafana-dashboards

# ------------------------------------------------------------------- Alertas
# Reglas, contact point de Discord, política de notificación y plantilla del
# mensaje: observability/grafana/alerting -> ConfigMap "grafana-alerting"
extraConfigmapMounts:
  - name: grafana-alerting
    mountPath: /etc/grafana/provisioning/alerting
    configMap: grafana-alerting
    readOnly: true
